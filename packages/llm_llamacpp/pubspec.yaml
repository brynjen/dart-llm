name: llm_llamacpp
description: llama.cpp backend implementation for LLM interactions. Enables local on-device inference with GGUF models on Android, iOS, macOS, Windows, and Linux.
version: 0.3.0
resolution: workspace
homepage: https://github.com/brynjen/dart-llm
repository: https://github.com/brynjen/dart-llm
issue_tracker: https://github.com/brynjen/dart-llm/issues
documentation: https://pub.dev/documentation/llm_llamacpp/latest/
topics:
  - llamacpp
  - llama
  - llm
  - flutter
  - ffi

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  llm_core: ^0.3.0
  ffi: ^2.1.3
  http: ^1.6.0
  path: ^1.9.0
  # Native Assets support (for hook/build.dart)
  hooks: ^2.0.0
  code_assets: ^1.2.1
  logging: ^1.3.0
  # Used by hook/build.dart to compute an ABI fingerprint of the FFI bindings,
  # which keys both the local prebuilt cache and the GitHub Releases asset URL
  # so that regenerating the bindings (because the upstream llama.cpp headers
  # changed) automatically invalidates incompatible prebuilt bundles.
  crypto: ^3.0.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
  ffigen: ^21.0.0
  dotenv: ^4.2.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      linux:
        ffiPlugin: true
