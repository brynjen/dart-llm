name: llm_vllm
description: VLLM backend implementation for LLM interactions. Provides streaming chat, embeddings, tool calling, vision support, and model management.
version: 0.2.0
resolution: workspace
homepage: https://github.com/brynjen/dart-llm
repository: https://github.com/brynjen/dart-llm
issue_tracker: https://github.com/brynjen/dart-llm/issues
documentation: https://pub.dev/documentation/llm_vllm/latest/
topics:
  - vllm
  - llm
  - ai
  - chat
  - embeddings

environment:
  sdk: ^3.8.0

dependencies:
  llm_core: ^0.2.0
  http: ^1.3.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
  dotenv: ^4.2.0
  path: ^1.9.0
