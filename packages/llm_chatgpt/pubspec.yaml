name: llm_chatgpt
description: OpenAI/ChatGPT backend implementation for LLM interactions. Provides streaming chat, embeddings, and tool calling via the OpenAI API.
version: 0.3.0
resolution: workspace
homepage: https://github.com/brynjen/dart-llm
repository: https://github.com/brynjen/dart-llm
issue_tracker: https://github.com/brynjen/dart-llm/issues
documentation: https://pub.dev/documentation/llm_chatgpt/latest/
topics:
  - openai
  - chatgpt
  - llm
  - ai
  - embeddings

environment:
  sdk: ^3.12.0

dependencies:
  llm_core: ^0.3.0
  http: ^1.6.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.0
  dotenv: ^4.2.0
  path: ^1.9.0
