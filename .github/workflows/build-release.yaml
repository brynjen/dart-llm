name: Build and Release llm_llamacpp

# Native release builds are driven by changes to llm_llamacpp landing on main —
# not by tags, and not by unrelated pushes. Pushing a tag does nothing; the
# release job creates the tag itself once a build succeeds.
#
# The paths below are deliberately narrow. They are the only things that change
# what the published native bundle is, or where the build hook looks for it:
#
#   pubspec.yaml            the version, which names the GitHub release
#   llama_bindings.dart     the FFI surface, which names the asset via its ABI
#                           fingerprint
#   hook/build.dart         how the bundle is built and located
#   llamacpp                the vendored llama.cpp submodule pointer
#
# Everything else under packages/llm_llamacpp (README, CHANGELOG, tests, Dart
# sources) leaves the native bundle byte-identical, so it must not spend an
# 8-platform build. Changes to this pipeline do not trigger one either — use
# "Run workflow" on the Actions tab after editing it.
on:
  push:
    branches:
      - main
    paths:
      - 'packages/llm_llamacpp/pubspec.yaml'
      - 'packages/llm_llamacpp/lib/src/bindings/llama_bindings.dart'
      - 'packages/llm_llamacpp/hook/build.dart'
      - 'packages/llm_llamacpp/llamacpp'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (default: version from packages/llm_llamacpp/pubspec.yaml)'
        required: false
      force:
        description: 'Rebuild even if the release already has matching assets'
        type: boolean
        default: false
      skip_linux:
        description: 'Skip Linux build'
        type: boolean
        default: false
      skip_macos:
        description: 'Skip macOS builds (arm64 and x64)'
        type: boolean
        default: false
      skip_windows:
        description: 'Skip Windows build'
        type: boolean
        default: false
      skip_android:
        description: 'Skip Android builds'
        type: boolean
        default: false
      skip_ios:
        description: 'Skip iOS build'
        type: boolean
        default: false

env:
  LLAMA_CPP_DIR: packages/llm_llamacpp/llamacpp

jobs:
  # ============================================
  # ABI fingerprint (must match hook/build.dart#_computeAbiFingerprint)
  # ============================================
  abi-fingerprint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fingerprint: ${{ steps.compute.outputs.fingerprint }}
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute ABI fingerprint
        id: compute
        run: |
          set -euo pipefail
          # MUST stay in lockstep with `_abiFingerprintInputs` and
          # `_computeAbiFingerprint` in packages/llm_llamacpp/hook/build.dart.
          # Each input contributes: relative-path, NUL, file-bytes-without-CR,
          # NUL. We then take the first 12 hex chars of SHA-256.
          INPUTS=(
            "lib/src/bindings/llama_bindings.dart"
          )
          ROOT="packages/llm_llamacpp"
          fingerprint=$(python3 - "$ROOT" "${INPUTS[@]}" <<'PY'
          import hashlib, sys
          root = sys.argv[1]
          paths = sys.argv[2:]
          h = hashlib.sha256()
          for rel in paths:
              h.update(rel.encode("utf-8"))
              h.update(b"\x00")
              with open(f"{root}/{rel}", "rb") as f:
                  h.update(f.read().replace(b"\r", b""))
              h.update(b"\x00")
          print(h.hexdigest()[:12])
          PY
          )
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "ABI fingerprint: $fingerprint"

      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail
          # Single source of truth: `version:` in the package's pubspec, which is
          # also what hook/build.dart reads to build the download URL. A manual
          # run may override it; a leading `v` is stripped either way, since
          # release tags are bare versions.
          PUBSPEC_VERSION=$(sed -n 's/^version:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p' \
            packages/llm_llamacpp/pubspec.yaml | head -n1)
          if [[ -z "$PUBSPEC_VERSION" ]]; then
            echo "::error::No top-level 'version:' found in packages/llm_llamacpp/pubspec.yaml"
            exit 1
          fi

          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$PUBSPEC_VERSION"
          elif [[ "$VERSION" != "$PUBSPEC_VERSION" ]]; then
            echo "::warning::Requested version $VERSION does not match pubspec version $PUBSPEC_VERSION. Building $VERSION, but hook/build.dart will request assets from release $PUBSPEC_VERSION and will not find them."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building native artifacts for version: $VERSION"

      - name: Decide whether a build is needed
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.resolve.outputs.version }}"
          ABI_FP="${{ steps.compute.outputs.fingerprint }}"

          if [[ "${{ github.event.inputs.force }}" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Forced rebuild requested."
            exit 0
          fi

          # Rebuild only when the release for this version does not already carry
          # assets for this exact ABI fingerprint. That covers both cases the
          # hook cares about: a new version, and regenerated bindings under an
          # existing version.
          EXPECTED="llm_llamacpp-v${VERSION}-abi${ABI_FP}-linux-x64.zip"
          if gh release view "${VERSION}" --json assets \
               --jq '.assets[].name' 2>/dev/null | grep -qx "$EXPECTED"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release ${VERSION} already has $EXPECTED; nothing to build."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Release ${VERSION} is missing $EXPECTED; building."
          fi

  # ============================================
  # Linux x64 Build (with CUDA and Vulkan)
  # ============================================
  build-linux-x64:
    runs-on: ubuntu-24.04
    needs: abi-fingerprint
    if: >-
      ${{ needs.abi-fingerprint.outputs.should_build == 'true'
          && !inputs.skip_linux }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          # `spirv-headers` is required by ggml/src/ggml-vulkan/CMakeLists.txt,
          # which does `find_package(SPIRV-Headers CONFIG REQUIRED)`. Upstream
          # llama.cpp installs the same package in its own Vulkan CI.
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libvulkan-dev \
            vulkan-tools \
            glslc \
            spirv-headers

      - name: Setup CUDA
        run: |
          # Install CUDA toolkit directly via runfile (more reliable than apt)
          CUDA_VERSION="12.4.1"
          CUDA_BUILD="550.54.15"
          
          wget -q https://developer.download.nvidia.com/compute/cuda/${CUDA_VERSION}/local_installers/cuda_${CUDA_VERSION}_${CUDA_BUILD}_linux.run
          
          sudo sh cuda_${CUDA_VERSION}_${CUDA_BUILD}_linux.run --silent --toolkit --no-man-page --no-drm
          
          # Add CUDA to PATH
          echo "/usr/local/cuda-12.4/bin" >> $GITHUB_PATH
          echo "CUDA_PATH=/usr/local/cuda-12.4" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=/usr/local/cuda-12.4/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          
          # Verify installation
          /usr/local/cuda-12.4/bin/nvcc --version

      - name: Build llama.cpp
        run: |
          mkdir -p build-linux-x64
          cd build-linux-x64
          
          cmake ../${{ env.LLAMA_CPP_DIR }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_CUDA=ON \
            -DGGML_VULKAN=ON
          
          cmake --build . --config Release -j$(nproc)

      - name: Package artifacts
        run: |
          VERSION="${{ needs.abi-fingerprint.outputs.version }}"
          
          mkdir -p dist
          
          # Copy main libraries
          cp build-linux-x64/bin/libllama.so dist/ || cp build-linux-x64/src/libllama.so dist/ || true
          cp build-linux-x64/bin/libggml.so dist/ || cp build-linux-x64/ggml/src/libggml.so dist/ || true
          cp build-linux-x64/bin/libggml-base.so dist/ || true
          cp build-linux-x64/bin/libggml-cpu.so dist/ || true
          
          # Copy GPU backends
          cp build-linux-x64/bin/libggml-cuda.so dist/ || true
          cp build-linux-x64/bin/libggml-vulkan.so dist/ || true
          
          # Find any remaining libs
          find build-linux-x64 -name "*.so" -exec cp {} dist/ \; 2>/dev/null || true
          
          # Create zip
          ABI_FP="${{ needs.abi-fingerprint.outputs.fingerprint }}"
          cd dist
          zip -r "../llm_llamacpp-v${VERSION}-abi${ABI_FP}-linux-x64.zip" *.so
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: llm_llamacpp-*.zip

  # ============================================
  # macOS arm64 Build (with Metal)
  # ============================================
  build-macos-arm64:
    runs-on: macos-14  # M1/M2 runner
    needs: abi-fingerprint
    if: >-
      ${{ needs.abi-fingerprint.outputs.should_build == 'true'
          && !inputs.skip_macos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Build llama.cpp
        run: |
          mkdir -p build-macos-arm64
          cd build-macos-arm64
          
          cmake ../${{ env.LLAMA_CPP_DIR }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON
          
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)

      - name: Package artifacts
        run: |
          VERSION="${{ needs.abi-fingerprint.outputs.version }}"
          
          mkdir -p dist
          
          # Copy libraries
          find build-macos-arm64 -name "*.dylib" -exec cp {} dist/ \;
          
          # Copy Metal shader if separate
          find build-macos-arm64 -name "*.metallib" -exec cp {} dist/ \; 2>/dev/null || true
          
          ABI_FP="${{ needs.abi-fingerprint.outputs.fingerprint }}"
          cd dist
          zip -r "../llm_llamacpp-v${VERSION}-abi${ABI_FP}-macos-arm64.zip" *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: llm_llamacpp-*.zip

  # ============================================
  # macOS x64 Build (with Metal, cross-compiled from ARM)
  # ============================================
  build-macos-x64:
    runs-on: macos-14  # Use free ARM runner, cross-compile to x64
    needs: abi-fingerprint
    if: >-
      ${{ needs.abi-fingerprint.outputs.should_build == 'true'
          && !inputs.skip_macos }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Build llama.cpp
        run: |
          mkdir -p build-macos-x64
          cd build-macos-x64
          
          # Cross-compile for x86_64 from ARM runner
          # IMPORTANT: Disable GGML_NATIVE to prevent -march=native (which would detect ARM)
          cmake ../${{ env.LLAMA_CPP_DIR }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_METAL=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_ACCELERATE=ON
          
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)

      - name: Package artifacts
        run: |
          VERSION="${{ needs.abi-fingerprint.outputs.version }}"
          
          mkdir -p dist
          find build-macos-x64 -name "*.dylib" -exec cp {} dist/ \;
          
          ABI_FP="${{ needs.abi-fingerprint.outputs.fingerprint }}"
          cd dist
          zip -r "../llm_llamacpp-v${VERSION}-abi${ABI_FP}-macos-x64.zip" *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: llm_llamacpp-*.zip

  # ============================================
  # Windows x64 Build (CPU + Vulkan)
  # Note: CUDA support skipped due to CI integration issues
  # Users needing CUDA can build from source
  # ============================================
  build-windows-x64:
    runs-on: windows-latest
    needs: abi-fingerprint
    if: >-
      ${{ needs.abi-fingerprint.outputs.should_build == 'true'
          && !inputs.skip_windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Vulkan SDK
        shell: pwsh
        run: |
          # 1.3.290.0 predates ggml-vulkan's `find_package(SPIRV-Headers CONFIG
          # REQUIRED)` and ships no SPIRV-Headers CMake config, so the configure
          # step failed even with VULKAN_SDK set. Track the version upstream
          # llama.cpp uses in its own Vulkan CI, and its installer filename.
          $vulkanVersion = "1.4.357.0"
          $vulkanUrl = "https://sdk.lunarg.com/sdk/download/${vulkanVersion}/windows/vulkansdk-windows-X64-${vulkanVersion}.exe"

          Write-Host "Downloading Vulkan SDK ${vulkanVersion}..."
          Invoke-WebRequest -Uri $vulkanUrl -OutFile vulkan_installer.exe -UseBasicParsing

          Write-Host "Installing Vulkan SDK..."
          Start-Process -FilePath "vulkan_installer.exe" -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -NoNewWindow

          # Set environment variables. ggml-vulkan appends $VULKAN_SDK to
          # CMAKE_PREFIX_PATH, which is how it finds SPIRV-Headers here.
          $vulkanPath = "C:\VulkanSDK\${vulkanVersion}"
          if (-not (Test-Path $vulkanPath)) {
            throw "Vulkan SDK not found at ${vulkanPath} after install"
          }
          echo "VULKAN_SDK=${vulkanPath}" >> $env:GITHUB_ENV
          echo "${vulkanPath}\Bin" >> $env:GITHUB_PATH

          Write-Host "Vulkan SDK installation complete"

      - name: Build llama.cpp
        shell: pwsh
        run: |
          mkdir build-windows-x64
          cd build-windows-x64
          
          cmake ..\${{ env.LLAMA_CPP_DIR }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_SERVER=OFF `
            -DLLAMA_BUILD_TOOLS=OFF `
            -DLLAMA_BUILD_APP=OFF `
            -DLLAMA_BUILD_COMMON=OFF `
            -DLLAMA_BUILD_UI=OFF `
            -DLLAMA_CURL=OFF `
            -DGGML_CUDA=OFF `
            -DGGML_VULKAN=ON
          
          cmake --build . --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Package artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.abi-fingerprint.outputs.version }}"
          
          New-Item -ItemType Directory -Force -Path dist
          
          # Copy DLLs from various locations
          Get-ChildItem -Path build-windows-x64 -Recurse -Filter "*.dll" | Copy-Item -Destination dist -Force
          
          # Create zip
          $abiFp = "${{ needs.abi-fingerprint.outputs.fingerprint }}"
          Compress-Archive -Path dist\* -DestinationPath "llm_llamacpp-v$version-abi$abiFp-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: llm_llamacpp-*.zip

  # ============================================
  # Android arm64-v8a Build (CPU with KleidiAI + Vulkan GPU)
  # ============================================
  build-android-arm64:
    runs-on: ubuntu-latest
    needs: abi-fingerprint
    if: >-
      ${{ needs.abi-fingerprint.outputs.should_build == 'true'
          && !inputs.skip_android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          # glslc / vulkan-headers are needed on the HOST so that
          # llama.cpp can build the host-side `vulkan-shaders-gen` tool which
          # compiles SPIR-V shaders that get baked into libggml-vulkan.so.
          # The Android target still links against the NDK's libvulkan.so stub.
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            glslc \
            libvulkan-dev \
            vulkan-tools \
            spirv-headers

          # ggml-vulkan does `find_package(SPIRV-Headers CONFIG REQUIRED)`, but
          # the NDK toolchain sets CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY, so a
          # host-installed package is invisible to the Android configure. Locate
          # the config now and pass its directory explicitly below.
          SPIRV_HEADERS_DIR=$(dirname "$(find /usr -name 'SPIRV-HeadersConfig.cmake' \
            -o -name 'spirv-headers-config.cmake' 2>/dev/null | head -n1)")
          if [[ -z "$SPIRV_HEADERS_DIR" || "$SPIRV_HEADERS_DIR" == "." ]]; then
            echo "::error::spirv-headers installed but no CMake config found under /usr"
            exit 1
          fi
          echo "SPIRV_HEADERS_DIR=$SPIRV_HEADERS_DIR" >> "$GITHUB_ENV"
          echo "SPIRV-Headers CMake config: $SPIRV_HEADERS_DIR"

      - name: Build llama.cpp for Android arm64
        run: |
          mkdir -p build-android-arm64
          cd build-android-arm64
          
          cmake ../${{ env.LLAMA_CPP_DIR }} \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=ON \
            -DGGML_CPU_KLEIDIAI=ON \
            -DGGML_OPENMP=ON \
            -DGGML_VULKAN=ON \
            -DGGML_VULKAN_RUN_TESTS=OFF \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DSPIRV-Headers_DIR="${SPIRV_HEADERS_DIR}"
          
          cmake --build . --config Release -j$(nproc)

      - name: Package artifacts
        run: |
          VERSION="${{ needs.abi-fingerprint.outputs.version }}"
          
          mkdir -p dist
          
          # Copy all .so files
          find build-android-arm64 -name "*.so" -exec cp {} dist/ \;
          
          # Copy OpenMP runtime required by GGML_OPENMP=ON.
          OMP_LIB=$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -path "*/lib/linux/aarch64/libomp.so" -type f | head -1)
          if [ -z "$OMP_LIB" ]; then
            echo "ERROR: libomp.so not found in Android NDK for arm64-v8a"
            exit 1
          fi
          cp "$OMP_LIB" dist/

          for lib in libllama.so libggml.so libggml-base.so libomp.so libggml-vulkan.so; do
            if [ ! -f "dist/$lib" ]; then
              echo "ERROR: Missing required Android arm64 library: $lib"
              exit 1
            fi
          done
          if ! compgen -G "dist/libggml-cpu*.so" > /dev/null; then
            echo "ERROR: Missing Android arm64 CPU backend libraries"
            exit 1
          fi

          ABI_FP="${{ needs.abi-fingerprint.outputs.fingerprint }}"
          cd dist
          zip -r "../llm_llamacpp-v${VERSION}-abi${ABI_FP}-android-arm64-v8a.zip" *.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-v8a
          path: llm_llamacpp-*.zip

  # ============================================
  # Android armeabi-v7a Build (32-bit ARM)
  # ============================================
  build-android-arm:
    runs-on: ubuntu-latest
    needs: abi-fingerprint
    if: >-
      ${{ needs.abi-fingerprint.outputs.should_build == 'true'
          && !inputs.skip_android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build llama.cpp for Android armeabi-v7a
        run: |
          mkdir -p build-android-arm
          cd build-android-arm
          
          cmake ../${{ env.LLAMA_CPP_DIR }} \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_OPENMP=OFF
          
          cmake --build . --config Release -j$(nproc)

      - name: Package artifacts
        run: |
          VERSION="${{ needs.abi-fingerprint.outputs.version }}"
          
          mkdir -p dist
          find build-android-arm -name "*.so" -exec cp {} dist/ \;
          
          for lib in libllama.so libggml.so libggml-base.so; do
            if [ ! -f "dist/$lib" ]; then
              echo "ERROR: Missing required Android armeabi-v7a library: $lib"
              exit 1
            fi
          done
          if ! compgen -G "dist/libggml-cpu*.so" > /dev/null; then
            echo "ERROR: Missing Android armeabi-v7a CPU backend libraries"
            exit 1
          fi

          ABI_FP="${{ needs.abi-fingerprint.outputs.fingerprint }}"
          cd dist
          zip -r "../llm_llamacpp-v${VERSION}-abi${ABI_FP}-android-armeabi-v7a.zip" *.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-armeabi-v7a
          path: llm_llamacpp-*.zip

  # ============================================
  # Android x86_64 Build (for emulator)
  # ============================================
  build-android-x86_64:
    runs-on: ubuntu-latest
    needs: abi-fingerprint
    if: >-
      ${{ needs.abi-fingerprint.outputs.should_build == 'true'
          && !inputs.skip_android }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build llama.cpp for Android x86_64
        run: |
          mkdir -p build-android-x86_64
          cd build-android-x86_64
          
          cmake ../${{ env.LLAMA_CPP_DIR }} \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DGGML_BACKEND_DL=ON \
            -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_OPENMP=OFF
          
          cmake --build . --config Release -j$(nproc)

      - name: Package artifacts
        run: |
          VERSION="${{ needs.abi-fingerprint.outputs.version }}"
          
          mkdir -p dist
          find build-android-x86_64 -name "*.so" -exec cp {} dist/ \;
          
          for lib in libllama.so libggml.so libggml-base.so; do
            if [ ! -f "dist/$lib" ]; then
              echo "ERROR: Missing required Android x86_64 library: $lib"
              exit 1
            fi
          done
          if ! compgen -G "dist/libggml-cpu*.so" > /dev/null; then
            echo "ERROR: Missing Android x86_64 CPU backend libraries"
            exit 1
          fi

          ABI_FP="${{ needs.abi-fingerprint.outputs.fingerprint }}"
          cd dist
          zip -r "../llm_llamacpp-v${VERSION}-abi${ABI_FP}-android-x86_64.zip" *.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-x86_64
          path: llm_llamacpp-*.zip

  # ============================================
  # iOS Build (xcframework with Metal)
  # ============================================
  build-ios:
    runs-on: macos-14
    needs: abi-fingerprint
    if: >-
      ${{ needs.abi-fingerprint.outputs.should_build == 'true'
          && !inputs.skip_ios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja

      - name: Build llama.cpp for iOS
        run: |
          mkdir -p build-ios-arm64
          cd build-ios-arm64
          
          cmake ../${{ env.LLAMA_CPP_DIR }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_CURL=OFF \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON
          
          cmake --build . --config Release -j$(sysctl -n hw.ncpu)

      - name: Create xcframework
        run: |
          VERSION="${{ needs.abi-fingerprint.outputs.version }}"
          
          mkdir -p dist
          
          # For iOS we typically need a framework or xcframework
          # Copy static libraries for now (Flutter will link them)
          find build-ios-arm64 -name "*.a" -exec cp {} dist/ \;
          find build-ios-arm64 -name "*.metallib" -exec cp {} dist/ \; 2>/dev/null || true
          
          ABI_FP="${{ needs.abi-fingerprint.outputs.fingerprint }}"
          cd dist
          zip -r "../llm_llamacpp-v${VERSION}-abi${ABI_FP}-ios-arm64.zip" *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: llm_llamacpp-*.zip

  # ============================================
  # Create Release
  # ============================================
  release:
    needs:
      - abi-fingerprint
      - build-linux-x64
      - build-macos-arm64
      - build-macos-x64
      - build-windows-x64
      - build-android-arm64
      - build-android-arm
      - build-android-x86_64
      - build-ios
    # Run even if some platform jobs were skipped, but not if any failed, and
    # not at all when the release already carries assets for this ABI.
    if: >-
      ${{ always()
          && needs.abi-fingerprint.outputs.should_build == 'true'
          && !contains(needs.*.result, 'failure')
          && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*.zip" | sort

      # The release tag is the bare version — no `v` prefix — because that is
      # the tag `hook/build.dart` builds its download URL from.
      - name: Determine tag
        id: version
        run: |
          set -euo pipefail
          TAG="${{ needs.abi-fingerprint.outputs.version }}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing as tag: ${TAG}"

      # Nothing triggers on tags, so the tag is always ours to create. A rebuild
      # of the same version moves it to the current commit.
      - name: Create or move tag to this commit
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -d "${TAG}" 2>/dev/null || true
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true

          git tag "${TAG}"
          git push origin "${TAG}"
          echo "Tagged: ${TAG}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
